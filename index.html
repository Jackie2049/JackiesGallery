<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JackiesGallery · 对外作品/报告聚合站</title>
<style>
  :root{--bg:#fafafa;--card:#fff;--text:#1f2328;--muted:#6b7280;--border:#e4e6eb;--accent:#4338ca;}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#e6e8eb;--muted:#9aa0a8;--border:#2a2e36;}}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;font-size:15px;}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 80px;}
  header h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em;}
  header .sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .1s;display:block;}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .card h2{margin:0 0 6px;font-size:17px;}
  .card .introduction{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .card .meta{font-size:12px;color:var(--accent);}
  .howto{margin-top:36px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 22px;}
  .howto h3{margin:0 0 8px;font-size:14px;}
  .howto p,.howto li{font-size:13px;color:var(--muted);}
  footer{margin-top:40px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>JackiesGallery</h1>
</header>

<!-- 展品列表：每份展品是一个自包含 HTML 文件，URL 即路径，可直链分享 -->
<div class="gallery" id="gallery"></div>

</div>

<script>
// 展品登记表：新增展品时在这里加一条
const THEME = [
  {
    title: '[News] 每日快报',
    introduction: '',
    directory: 'news_overview/',
    date: '2026-08'
  },
  {
    title: '[Harness] DeepSeek Harness',
    introduction: 'DeepSeek Harness开源项目研究报告',
    directory: 'harness_research/report_deepseek-harness.html',
    date: '2026-08'
  },
  {
    title: '[vLLM] 系统架构',
    introduction: 'vLLM架构视图PlantUML',
    directory: 'infer_vLLM/',
    date: '2026-08'
  },
  {
    title: '[0daybot] 推理开箱工作流',
    introduction: '在vLLM上进行新模型开箱适配',
    directory: 'infer_0daybot/',
    date: '2026-08'
  }
];
document.getElementById('gallery').innerHTML = THEME.map(e=>
  '<a class="card" href="'+e.directory+'"'+(e.directory.indexOf('http')===0?' target="_blank" rel="noopener"':'')+'>'+
  '<h2>'+e.title+'</h2>'+
  '<div class="introduction">'+e.introduction+'</div>'+
  '<div class="meta">'+e.date+(e.directory.indexOf('http')===0?' · 外部链接': '')+'</div></a>'
).join('');
</script>
</body>
</html>
